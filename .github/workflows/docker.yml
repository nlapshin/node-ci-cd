name: Deploy to VDS via Docker

on:
  push:
    branches:
      - main

jobs:
  docker-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

          # инкрементально
          # тайпштемп + ветку + инткеремнт
      - name: Set version tag
        id: vars
        run: echo "TAG=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/my-app:${{ steps.vars.outputs.TAG }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/my-app:${{ steps.vars.outputs.TAG }} ${{ secrets.DOCKER_USERNAME }}/my-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/my-app:${{ steps.vars.outputs.TAG }}
          docker push ${{ secrets.DOCKER_USERNAME }}/my-app:latest

      - name: SSH to VDS and deploy container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 3d598a13308b.vps.myjino.ru
          port: 49205
          username: otus
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/my-app:latest
            docker stop my-app || true
            docker rm my-app || true
            docker run -d --name my-app -p 80:3000 --restart always ${{ secrets.DOCKER_USERNAME }}/my-app:latest